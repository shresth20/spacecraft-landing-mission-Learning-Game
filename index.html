<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#03050c" />
  <!-- inline, so the browser's automatic /favicon.ico request never
       404s: nothing on the server has to exist for it -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2306101f'/%3E%3Cpath d='M32 10 54 50H10Z' fill='%234fd8ff'/%3E%3C/svg%3E" />
  <!-- filled from locales/locales.json (pageTitle) once the locale is in -->
  <title>Spacecraft Landing Mission</title>
  <!-- performance diagnostics, only when the URL carries ?perf=1 (js/perf-hud.js) -->
  <script>if (/[?&]perf=1\b/.test(location.search)) document.write('<script src="js/perf-hud.js"><\/script>');</script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animation.css" />
  <!-- the playing screens' sites: the shape task, the area task and
       the islands they are played on -->
  <link rel="stylesheet" href="css/rounds.css" />
  <!-- the landing and its two failures.
       After style.css and rounds.css, and it has to stay there:
       the phase rules take the craft back off the idle bob and the
       arrival flight, and they do it on equal specificity, so being
       later in the cascade is the whole mechanism. -->
  <link rel="stylesheet" href="css/failure.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- the shore, the shallows, the foam and the sea itself.
       Last of the mission's own sheets, because the two rules it
       overrides outright (.zone__wake's weight, and the sea
       artwork's swell) are written at the same specificity as the
       ones they replace. -->
  <link rel="stylesheet" href="css/water.css" />
  <!-- the lesson's board, scoped to its own screen (.screen--learn)
       so none of it reaches the mission's chrome -->
  <link rel="stylesheet" href="css/learn.css" />
  <!-- the second lesson's board, scoped the same way (.screen--learnq) -->
  <link rel="stylesheet" href="css/learn-quad.css" />

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="assets/fonts/libre_baskerville/librebaskerville-variablefont_wght.woff2" />
  <!-- the gate's title is the first type on screen, and it is the
       only thing set in this face -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="assets/fonts/lilita_one/lilitaone-regular.woff2" />
  <!-- the lesson's board is lettered in this one -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="assets/fonts/baloo_2/baloo2-variablefont_wght.woff2" />

  <!-- No <link rel=preload> for the artwork or the audio: the start
       gate fetches every asset itself (js/preload.js) so the loading
       bar can count real bytes, and a preload here would only fetch
       each file a second time under a different request mode. -->
</head>
<body>

<div class="stage" id="stage">

  <!-- ══════════════════════════ SCREEN 1 — COCKPIT ══════════════════════════ -->
  <section class="screen screen--cockpit is-active" id="screenCockpit">

    <!-- deep space, stretched to fill -->
    <div class="layer layer--bg s1-bg" aria-hidden="true"></div>

    <!-- drifting stars seen through the canopy -->
    <div class="starfield" id="starfield" aria-hidden="true"></div>

    <!-- the drone flies out through the canopy: sits BELOW the cockpit frame -->
    <div class="flyout" id="flyout" aria-hidden="true">
      <div class="flyout__drone" id="flyDrone">
        <span class="flyout__wash"></span>
        <picture>
          <source type="image/avif" srcset="assets/images/drone.avif" />
          <img src="assets/images/drone.webp" alt="" />
        </picture>
      </div>
      <div class="flyout__trail" id="flyTrail"></div>
    </div>

    <!-- cockpit interior, stretched to fill, painted over the window -->
    <div class="layer layer--cockpit s1-cockpit" aria-hidden="true"></div>

    <!-- ░░ dashboard readout (the yellow box) ░░ -->
    <div class="dash" id="dash">
      <canvas class="dash__wave" id="waveCanvas"></canvas>
      <div class="dash__grid" aria-hidden="true"></div>
      <div class="dash__sheen" aria-hidden="true"></div>
    </div>

    <!-- narration subtitle, read against the canopy -->
    <p class="subtitle" id="cockpitCaption" role="status" aria-live="polite"></p>

    <!-- ░░ LAUNCH button ░░ -->
    <div class="launch-slot" id="launchSlot">
      <button class="launch" id="launchBtn" type="button"
              aria-label="Launch the survey drone" data-i18n-attr="aria-label:launchAria">
        <span class="launch__ring" aria-hidden="true"></span>
        <span class="launch__body">
          <!-- decorative: the cap carries no type of its own, and
               the button's name is on the <button> itself -->
          <picture>
            <source type="image/avif" srcset="assets/images/Launch%20button.avif">
            <img class="launch__plate" src="assets/images/Launch%20button.webp"
                 alt="" draggable="false">
          </picture>
          <span class="launch__flash" aria-hidden="true"></span>
        </span>
      </button>
    </div>

  </section>


  <!-- ══════════════════════════ SCREEN 2 — THE SURVEY ══════════════════════════

       One screen, one continuous shot over one sea.

       The drone's lens opens on the whole archipelago from survey
       height — small islands of every shape in the mission,
       breaking the surface across a sea several frames wide — and
       comes down on four SITES in turn:

         SQUARE     three squares of three sizes and two other
                    shapes: "select all the square landing zones"
         RECTANGLE  the same question of the rectangles
         TRIANGLE   and of the triangles
         GALLERY    one square, one rectangle and one triangle, each
                    with its name under it: the beat that hands the
                    mission over to the lesson (screen 3)

       Between any two the lens climbs back to altitude, crosses
       the water, and descends on the next — see THE CAMERA in
       js/animation.js and runRound() in js/script.js.

       ── the world ──

       `.cam` is the camera plate and everything inside it is in
       WORLD coordinates: per cent of one frame, with the first
       site's frame at (0..100, 0..100) and the others standing
       around it on a diamond (see .site in css/style.css and the
       `at` figures in js/pages.js). The islets are strewn over the
       water between and around them. The camera's ground state at
       any site is a translate and a scale of exactly 1, so the
       layout each task is measured on is the layout itself.

       The plate is EMPTY here: GeoPages.buildSurvey() fills it at
       boot with the islets and the four sites, exactly as it builds
       the screens that follow the lesson.
       ══════════════════════════════════════════════════════════════════════ -->
  <section class="screen screen--drone" id="screenDrone">

    <!-- ocean, faded up once the scan completes -->
    <div class="layer layer--bg s2-bg" id="oceanBg" aria-hidden="true"></div>

    <!-- the dark: sits over the ocean until the scan lands -->
    <div class="blackout" id="blackout" aria-hidden="true"></div>

    <!-- ░░ THE CAMERA ░░
         The lens, and everything it actually flies over. The bezel,
         the scanner, the haze, the altimeter, the narration bar,
         the HUD lines and the NEXT button are all OUTSIDE it — they
         are on the lens, not under it, so they hold still while the
         water moves. js/water.js mounts the wave fronts in here too.
         See the .cam block in css/style.css. -->
    <div class="cam" id="cam"></div>

    <!-- the air between a camera at survey height and the water
         under it: full while the lens is high, gone by the time it
         is down. -->
    <div class="aerial" aria-hidden="true"></div>

    <!-- the acquisition bracket. Drawn at FRAME scale rather than
         inside the camera, so its corners are placed on where the
         wide lens is showing a site (see siteBox() in js/script.js)
         and its line weight does not shrink with it. -->
    <div class="fix" aria-hidden="true">
      <div class="fix__box">
        <span class="fix__ring"></span>
        <i class="fix__c fix__c--tl"></i>
        <i class="fix__c fix__c--tr"></i>
        <i class="fix__c fix__c--bl"></i>
        <i class="fix__c fix__c--br"></i>
      </div>
    </div>

    <!-- ░░ altimeter ░░ the one instrument on the feed, and it is
         here to say that what is changing is the CAMERA and not the
         islands. It follows the lens itself — see altFollow() in
         js/script.js. -->
    <div class="alt" id="altHud" aria-hidden="true">
      <span class="alt__track"><i class="alt__mark"></i></span>
      <span class="alt__read">
        <span class="alt__row">
          <b class="alt__num" id="altNum">4200</b><i class="alt__unit" data-i18n="altUnit">m</i>
        </span>
        <em class="alt__state" id="altState" data-i18n="altStandby">STANDBY</em>
      </span>
    </div>

    <!-- green neon scanner sweep -->
    <div class="scanner" id="scanner" aria-hidden="true">
      <div class="scanner__wash"></div>
      <div class="scanner__bar">
        <span class="scanner__core"></span>
        <span class="scanner__glow"></span>
      </div>
    </div>

    <!-- HUD frame, stretched to fill — retired once the scan lands -->
    <div class="layer layer--hud drone-hud" id="droneHud" aria-hidden="true"></div>

    <!-- ░░ celebration ░░ built by JS (see M.confetti) -->
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <!-- the formula and the tally, under the landing -->
    <div class="hud" id="landHud">
      <p class="hud__caption" id="landCaption" role="status" aria-live="polite"></p>
      <p class="hud__tally" id="landTally" role="status" aria-live="polite"></p>
    </div>

    <!-- ░░ narration bar — typed in step with the voice-over ░░ -->
    <header class="topbar" id="topbar">
      <div class="topbar__frame">
        <span class="topbar__badge" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.2c2.7 2.8 4.1 6.3 4.1 9.8v3.4H7.9V12c0-3.5 1.4-7 4.1-9.8z" />
            <path d="M7.9 12.4 5.1 15.3v3.4l2.8-2M16.1 12.4l2.8 2.9v3.4l-2.8-2" />
            <path d="M10.2 15.8c0 2.2.7 4.1 1.8 5.4 1.1-1.3 1.8-3.2 1.8-5.4z" />
            <circle cx="12" cy="9.2" r="1.7" />
          </svg>
        </span>
        <p class="topbar__text" id="topbarText" role="status" aria-live="polite"></p>
      </div>
    </header>

    <!-- ░░ on to the next screen ░░
         Hidden until a landing is planted: it is the reward for the
         right answer, not a way past the question. The survey ends
         on the gallery, which goes on by itself. -->
    <div class="advance" aria-hidden="false">
      <button class="advance__btn" id="advanceBtn" type="button" hidden>
        <span class="advance__label" data-i18n="btnNext">NEXT</span>
        <svg class="advance__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </button>
    </div>

  </section>


  <!-- ══════════════════════════ SCREEN 3 — THE LESSON ══════════════════════════

       The warm-up and the triangle lesson, brought over from the
       learning module: a board on its own landscape, with Swiftee,
       played by js/learn.js and dressed by css/learn.css. Both are
       scoped to this section, so nothing in here reaches the
       mission's own chrome and nothing of the mission's reaches in.

         page 2  the three shapes draw themselves; "Here are a few
                 common shapes." / "Drag each name to the matching
                 shape." / "Great! Now let's recall their area
                 formulas." — two rounds of drag-and-drop, then
                 "Well Done!" and Next
         page 3  one triangle, then three: "Triangles can look
                 different. But their area depends on the base and
                 height." / "Let's observe their base and height."
                 — the dotted base and height grow on, the formula
                 types itself out and lights them, then Next, which
                 brings the mission back (screen 4)
       ══════════════════════════════════════════════════════════════════════ -->
  <section class="screen screen--learn" id="screenLearn">

    <!-- the landscape the board stands on -->
    <div class="layer layer--bg learn-bg" aria-hidden="true"></div>

    <!-- arrowheads for the measuring lines, one per colour a base
         or a height can be drawn in, and the Next disc's artwork.
         Not display:none, which would stop the markers painting. -->
    <svg class="learn-defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <marker id="dimArrow" class="dim-arrow" viewBox="0 0 6 6" refX="5" refY="3"
                markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M1.2 .8 L5 3 L1.2 5.2" />
        </marker>
        <marker id="dimArrowBase" class="dim-arrow" viewBox="0 0 6 6" refX="5" refY="3"
                markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M1.2 .8 L5 3 L1.2 5.2" />
        </marker>
        <marker id="dimArrowHeight" class="dim-arrow" viewBox="0 0 6 6" refX="5" refY="3"
                markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M1.2 .8 L5 3 L1.2 5.2" />
        </marker>

        <symbol id="ico-next" viewBox="0 0 100 100">
          <linearGradient id="icoNextFace" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="var(--next-face-1)" />
            <stop offset=".55" stop-color="var(--next-face-2)" />
            <stop offset="1" stop-color="var(--next-face-3)" />
          </linearGradient>
          <!-- the rim, set a little low so it reads as the thickness of a disc -->
          <circle cx="50" cy="51.5" r="45" fill="var(--next-rim)" />
          <circle cx="50" cy="50" r="41.5" fill="url(#icoNextFace)" />
          <!-- the arrow: drawn small and grown back by a round stroke, which is
               what rounds every corner of it evenly -->
          <path d="M31.25 43.125 H52.5 V31.25 L77.5 50 L52.5 68.75 V56.875 H31.25 Z"
                fill="var(--next-arrow)" stroke="var(--next-arrow)" stroke-width="8.75"
                stroke-linejoin="round" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>

    <!-- Swiftee's stand-in for the half of its jump that happens behind the
         board: it sits before the board in the document, so it paints under
         it, and js/learn.js hands over to the in-board sprite at the top of
         the arc. -->
    <div class="hopper" id="hopper" aria-hidden="true"></div>

    <div class="learn-stage">
      <main class="board" id="board">

        <!-- The instruction is the board's heading, with Swiftee standing to
             its left. It types itself out in step with the voice-over and
             then stays for the rest of the round. -->
        <header class="prompt-row">
          <h2 class="prompt" id="prompt">
            <!-- Swiftee's place for the whole lesson: it jumps in here from
                 behind the board once there is something to say, and stands
                 at the left end of whatever line the heading shows -->
            <div class="mascot" id="mascot" aria-hidden="true"></div>
            <span class="type-wrap">
              <!-- invisible copy of the line the heading shows: holds the
                   width, so neither the text nor Swiftee beside it moves as
                   the words arrive -->
              <span class="type-ghost" id="promptGhost"></span>
              <span class="type" id="promptType" aria-live="polite"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
            <!-- Swiftee's reaction to an answer, for the screen reader only: on
                 the board the bird and the sound do the acknowledging -->
            <span class="quip" id="quip" aria-live="polite"></span>
          </h2>
        </header>

        <section class="bay" id="bay">
          <!-- Cell 1 -->
          <div class="cell">
            <div class="shape-stage">
              <div class="shape" data-shape="rect" role="img" aria-label="A rectangle" data-i18n-attr="aria-label:ariaRectangle">
                <!-- overflow is visible, so the dimension labels sit outside the
                     viewBox without changing the artwork's layout box -->
                <svg viewBox="-40 0 320 170" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                  <defs>
                    <clipPath id="wipeRect"><rect class="wipe" x="0" y="0" width="240" height="132" /></clipPath>
                  </defs>
                  <g class="art">
                    <rect class="shape-fill" clip-path="url(#wipeRect)"
                          x="4" y="4" width="232" height="124" />
                    <path class="shape-outline" d="M4 4 H236 V128 H4 Z" fill="none" stroke-width="5" />
                  </g>
                  <!-- shown in round 2, after the first wrong drop -->
                  <g class="labels">
                    <g class="wdim wdim-h"><line class="wdim-line" x1="4" y1="144" x2="236" y2="144" /><path class="wdim-head" d="M9.6 140.5 L4 144 L9.6 147.5 M230.4 140.5 L236 144 L230.4 147.5" /><text class="shape-label" x="120" y="160" font-size="13" text-anchor="middle" data-i18n="labelLength">length</text></g>
                    <g class="wdim wdim-v"><line class="wdim-line" x1="252" y1="4" x2="252" y2="128" /><path class="wdim-head" d="M248.5 9.6 L252 4 L255.5 9.6 M248.5 122.4 L252 128 L255.5 122.4" /><text class="shape-label" x="268" y="66" font-size="13" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 268 66)" data-i18n="labelBreadth">breadth</text></g>
                  </g>
                </svg>
              </div>
            </div>
            <!-- both rounds' slots exist from the first frame so the bay never
                 changes height between levels -->
            <div class="dock">
              <div class="slot" data-round="1" data-accept="rect" aria-label="Name of the first shape" data-i18n-attr="aria-label:ariaNameFirst"></div>
              <div class="slot" data-round="2" data-accept="rect" aria-label="Area of the first shape" data-i18n-attr="aria-label:ariaAreaFirst"></div>
            </div>
          </div>

          <!-- Cell 2 -->
          <div class="cell">
            <div class="shape-stage">
              <div class="shape" data-shape="square" role="img" aria-label="A square" data-i18n-attr="aria-label:ariaSquare">
                <svg viewBox="-40 0 240 200" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                  <defs>
                    <clipPath id="wipeSquare"><rect class="wipe" x="0" y="0" width="160" height="160" /></clipPath>
                  </defs>
                  <g class="art">
                    <rect class="shape-fill" clip-path="url(#wipeSquare)"
                          x="4" y="4" width="152" height="152" />
                    <path class="shape-outline" d="M4 4 H156 V156 H4 Z" fill="none" stroke-width="5" />
                  </g>
                  <g class="labels">
                    <g class="wdim wdim-h"><line class="wdim-line" x1="4" y1="170" x2="156" y2="170" /><path class="wdim-head" d="M9.6 166.5 L4 170 L9.6 173.5 M150.4 166.5 L156 170 L150.4 173.5" /><text class="shape-label" x="80" y="186" font-size="13" text-anchor="middle" data-i18n="labelSide">side</text></g>
                    <g class="wdim wdim-v"><line class="wdim-line" x1="172" y1="4" x2="172" y2="156" /><path class="wdim-head" d="M168.5 9.6 L172 4 L175.5 9.6 M168.5 150.4 L172 156 L175.5 150.4" /><text class="shape-label" x="188" y="80" font-size="13" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 188 80)" data-i18n="labelSide">side</text></g>
                  </g>
                </svg>
              </div>
            </div>
            <div class="dock">
              <div class="slot" data-round="1" data-accept="square" aria-label="Name of the second shape" data-i18n-attr="aria-label:ariaNameSecond"></div>
              <div class="slot" data-round="2" data-accept="square" aria-label="Area of the second shape" data-i18n-attr="aria-label:ariaAreaSecond"></div>
            </div>
          </div>

          <!-- Cell 3 -->
          <div class="cell">
            <div class="shape-stage">
              <div class="shape" data-shape="triangle" role="img" aria-label="A triangle" data-i18n-attr="aria-label:ariaTriangle">
                <svg viewBox="-45 0 290 210" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                  <defs>
                    <clipPath id="wipeTri"><rect class="wipe" x="0" y="0" width="200" height="172" /></clipPath>
                  </defs>
                  <g class="art">
                    <polygon class="shape-fill" clip-path="url(#wipeTri)"
                             points="100,6 195,166 5,166" />
                    <path class="shape-outline" d="M100 6 L195 166 L5 166 Z" fill="none" stroke-width="5" />
                  </g>
                  <g class="labels">
                    <line class="height-line" x1="100" y1="10" x2="100" y2="166" />
                    <g class="wdim wdim-h"><line class="wdim-line" x1="5" y1="182" x2="195" y2="182" /><path class="wdim-head" d="M10.6 178.5 L5 182 L10.6 185.5 M189.4 178.5 L195 182 L189.4 185.5" /><text class="shape-label" x="100" y="198" font-size="13" text-anchor="middle" data-i18n="labelBase">base</text></g>
                    <g class="wdim wdim-v"><line class="wdim-line" x1="-14" y1="6" x2="-14" y2="166" /><path class="wdim-head" d="M-17.5 11.6 L-14 6 L-10.5 11.6 M-17.5 160.4 L-14 166 L-10.5 160.4" /><text class="shape-label" x="-30" y="86" font-size="13" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 -30 86)" data-i18n="labelHeight">height</text></g>
                  </g>
                </svg>
              </div>
            </div>
            <div class="dock">
              <div class="slot" data-round="1" data-accept="triangle" aria-label="Name of the third shape" data-i18n-attr="aria-label:ariaNameThird"></div>
              <div class="slot" data-round="2" data-accept="triangle" aria-label="Area of the third shape" data-i18n-attr="aria-label:ariaAreaThird"></div>
            </div>
          </div>
        </section>

        <!-- ---------- page 3: the triangle lesson ----------
             Shares the bay's grid cell and is invisible until the warm-up has
             cleared away. Each triangle is built like the warm-up shapes -- an
             outline path that draws itself, a fill that pours in behind a clip --
             plus a set of dotted dimension lines the script grows into place and
             lights up as the formula names them. One viewBox for all three, so the
             bases sit on one line. -->
        <section class="lesson" id="lesson" aria-hidden="true">
          <div class="tri-row" id="triRow">

            <!-- acute (isosceles): the height stands inside it -->
            <div class="tri-cell">
              <div class="tri" data-tri="acute" role="img" aria-label="An acute triangle" data-i18n-attr="aria-label:ariaAcuteTriangle">
                <svg viewBox="0 13 240 197" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                  <defs>
                    <clipPath id="wipeTriA"><rect class="wipe" x="0" y="0" width="240" height="210" /></clipPath>
                  </defs>
                  <g class="art">
                    <polygon class="shape-fill" clip-path="url(#wipeTriA)" points="120,16 218,176 22,176" />
                    <path class="shape-outline" d="M120 16 L218 176 L22 176 Z" fill="none" stroke-width="5" />
                  </g>
                  <g class="dims">
                    <line class="dim dim-base"   x1="22"  y1="186" x2="218" y2="186" />
                    <line class="dim dim-height" x1="120" y1="16"  x2="120" y2="176" />
                    <path class="dim-mark" d="M132 176 V164 H120" />
                    <text class="dim-label lbl-base" x="120" y="203" font-size="13" text-anchor="middle" data-i18n="labelBaseCap">Base</text>
                    <text class="dim-label lbl-height" x="133" y="98" font-size="13" text-anchor="middle"
                          dominant-baseline="middle" transform="rotate(-90 133 98)" data-i18n="labelHeightCap">Height</text>
                  </g>
                </svg>
              </div>
            </div>

            <!-- right-angled (scalene): the height is one of its own sides -->
            <div class="tri-cell">
              <div class="tri" data-tri="right" role="img" aria-label="A right-angled scalene triangle" data-i18n-attr="aria-label:ariaRightTriangle">
                <svg viewBox="0 13 240 197" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                  <defs>

  <div class="gate" id="gate">

<script src="js/lifecycle.js"></script>
<!-- generated from the files on disk by tools/build_manifest.py:
     the byte size of every asset, so the loading bar can weight each
     file by what it really costs before a single Content-Length has
     come back. Regenerate it whenever an asset changes. -->
<script src="js/manifest.js"></script>
<!-- the loading bar's fetcher: streams every asset with a byte
     count, smallest first, five at a time, and hands each one back
     as a blob: URL. Before audio.js, which adopts those URLs. -->
<script src="js/preload.js"></script>
<!-- the words: every line and every clip by key, from
     locales/locales.json. Before audio.js, which names its clips
     through it. -->
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/waveform.js"></script>
<script src="js/typewriter.js"></script>
<script src="js/animation.js"></script>
<!-- the landing and its two failures. After animation.js (it uses
     the same GeoLife-backed wait) and before script.js, which calls
     GeoFail from every landing site. -->
<script src="js/failure.js"></script>
<!-- the playing screens: the shape data and the markup built from
     it. Before script.js, which asks it for the screens while it is
     booting. -->
<script src="js/pages.js"></script>
<!-- the water. After pages.js, whose measured silhouettes every
     shoreline is built from, and before script.js, which calls
     GeoWater.init() from boot() once the screens exist. -->
<script src="js/water.js"></script>
<!-- the lesson's motion system, in the one order it can load in:
     GSAP, then the Flip plugin it registers, then js/motion.js which
     holds every duration and easing the lesson uses, then the
     mascot's sprite sheets and the lesson itself. All local --
     nothing here reaches the network. -->
<script src="js/libs/gsap.min.js"></script>
<script src="js/libs/Flip.min.js"></script>
<script src="js/motion.js"></script>
<script src="js/swiftee-sheets.js"></script>
<script src="js/learn.js"></script>
<!-- the second lesson, after the first: it shares GSAP's clock and
     the mascot's sheets with it -->
<script src="js/learn-quad.js"></script>
<!-- The mission comes last, and only once the locale is in: i18n.js
     reads ?lan=xx from the URL, loads locales/locales.json (or the
     generated locales/locales.js when a file:// page cannot fetch
     it), fills every data-i18n* attribute above, and only then loads
     the flow -- so every line it builds is already in the chosen
     language. -->
<script>
  I18n.load(function () {
    I18n.applyStatic(document);
    /* and once js/preload.js knows whether AVIF decodes here, so the
       islands and crafts the flow builds ask for the right file */
    var art = window.GeoLoad && GeoLoad.art ? GeoLoad.art : Promise.resolve();
    art.then(function () {
      var s = document.createElement('script');
      s.src = 'js/script.js';
      document.body.appendChild(s);
    });
  });
</script>
